<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Física y Química — Unidades 6, 7 y 8 (UNAJ 2025)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Lector externo PDF.js para renderizado vectorial nítido de los PDFs originales -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col">

  <!-- FONDO DE NEBULOSA CON MOVIMIENTO SUTIL Y ESTRELLAS/NUBES QUE PULSAN EN BRILLO -->
  <div class="nebula-bg-wrapper" aria-hidden="true">
    <div class="nebula-bg-image"></div>
    <div class="nebula-clouds-glow"></div>
  </div>
  <canvas id="starfieldCanvas" aria-hidden="true"></canvas>

  <!-- BARRA SUPERIOR STICKY PRINCIPAL (OCUPA TODO EL ANCHO HASTA LOS LATERALES) -->
  <nav class="sticky-cosmic-nav" aria-label="Navegación Principal">
    <div class="w-full max-w-none mx-auto flex items-center justify-between gap-2 md:gap-4 px-2 md:px-4">

      <!-- Izquierda: Botón Circular del Capibara con Banana (Despliega/Repliega Hoja de Fórmulas Lateral y empuja el contenido) -->
      <div class="flex items-center gap-2.5">
        <button
          id="btnFormulaDrawerToggle"
          type="button"
          onclick="toggleFormulaDrawer()"
          class="capy-circle-btn"
          title="Abrir / Cerrar Hoja de Fórmulas (Esc para cerrar)">
          <img id="capyFormulaToggleImg" src="assets/capy_banana.webp" alt="Hoja de Fórmulas" class="w-11 h-11 object-contain sprite-no-bg">
        </button>
        <button
          id="formulaDrawerHint"
          type="button"
          onclick="toggleFormulaDrawer()"
          class="patrick-pill-label text-amber-300 hover:text-white transition cursor-pointer">
          Fórmulas
        </button>
      </div>

      <!-- Centro: Unidades, Ejercicios y Parcial (En fuente Patrick Hand más grande) -->
      <div class="flex flex-wrap items-center justify-center gap-2 md:gap-3">
        <button id="navBtnU6" type="button" onclick="switchTopNav('u6')" class="quantum-nav-btn active">Unidad 6</button>
        <button id="navBtnU7" type="button" onclick="switchTopNav('u7')" class="quantum-nav-btn">Unidad 7</button>
        <button id="navBtnU8" type="button" onclick="switchTopNav('u8')" class="quantum-nav-btn">Unidad 8</button>
        <button id="navBtnEj" type="button" onclick="switchTopNav('ejercicios')" class="quantum-nav-btn">Ejercicios</button>
        <button id="navBtnParcial" type="button" onclick="switchTopNav('parcial')" class="quantum-nav-btn">Parcial</button>
      </div>

      <!-- Derecha: Botón 'Archivos' + Botón Lateral 'Calculadora' con su Capibara Científico -->
      <div class="flex items-center gap-2.5 md:gap-3.5">

        <!-- Menú Desplegable 'Archivos' -->
        <div class="relative">
          <button
            id="navBtnArchivos"
            type="button"
            onclick="toggleArchivosMenu()"
            class="quantum-nav-btn flex items-center gap-1.5">
            <span>Archivos</span>
            <span id="archivosCaret" class="text-sm transition-transform">▾</span>
          </button>

          <!-- Menú hacia abajo con los archivos originales en HD -->
          <div id="archivosDropdownMenu" class="archivos-dropdown-menu hidden text-left space-y-2.5">
            <div class="flex items-center justify-between px-2 py-0.5">
              <span class="text-sm text-amber-300 font-patrick tracking-wide uppercase">
                PDFs Oficiales Nítidos
              </span>
              <span class="text-[11px] text-slate-400 font-patrick">[Esc cierra]</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5 px-1">
              <button type="button" onclick="openOriginalFileViewer('u6', 1, { scrollToPdf: true })" class="px-2.5 py-2 rounded-xl bg-slate-900/85 hover:bg-amber-400 hover:text-slate-950 text-base font-bold text-slate-100 font-patrick transition text-center">
                Unidad 6
              </button>
              <button type="button" onclick="openOriginalFileViewer('u7', 1, { scrollToPdf: true })" class="px-2.5 py-2 rounded-xl bg-slate-900/85 hover:bg-amber-400 hover:text-slate-950 text-base font-bold text-slate-100 font-patrick transition text-center">
                Unidad 7
              </button>
              <button type="button" onclick="openOriginalFileViewer('u8', 1, { scrollToPdf: true })" class="px-2.5 py-2 rounded-xl bg-slate-900/85 hover:bg-amber-400 hover:text-slate-950 text-base font-bold text-slate-100 font-patrick transition text-center">
                Unidad 8
              </button>
            </div>

            <div class="border-t border-slate-700/60 my-1.5"></div>

            <button type="button" onclick="openOriginalFileViewer('carpeta', 1, { scrollToPdf: true })" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-cyan-500/30 text-left text-base text-slate-100 font-patrick flex items-center justify-between transition">
              <span>📒 Carpeta Completa (22 hojas HD)</span>
              <span class="text-xs text-cyan-300 font-bold">Ver en PDF</span>
            </button>

            <button type="button" onclick="openOriginalFileViewer('simulacro', 1, { scrollToPdf: true })" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-cyan-500/30 text-left text-base text-slate-100 font-patrick flex items-center justify-between transition">
              <span>📝 Modelo de Parcial y Guía Word</span>
              <span class="text-xs text-cyan-300 font-bold">Ver en PDF</span>
            </button>

            <button type="button" onclick="openOriginalFileViewer('estructura', 1, { scrollToPdf: true })" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-cyan-500/30 text-left text-base text-slate-100 font-patrick flex items-center justify-between transition">
              <span>📋 Estructura de 2° Parcial 2025</span>
              <span class="text-xs text-cyan-300 font-bold">Ver en PDF</span>
            </button>
          </div>
        </div>

        <!-- Botón 'Calculadora' + Ícono de Capibara con Calculadora -->
        <div class="flex items-center gap-2">
          <button
            id="btnCalculatorHint"
            type="button"
            onclick="toggleCalculatorDrawer()"
            class="quantum-nav-btn !px-3.5 !py-1.5 flex items-center gap-1.5"
            title="Abrir / Cerrar Calculadora de Dato Faltante (Esc para cerrar)">
            <span>Calculadora</span>
          </button>
          <button
            id="btnCalculatorDrawerToggle"
            type="button"
            onclick="toggleCalculatorDrawer()"
            class="capy-circle-btn calc-capy-btn"
            title="Abrir / Cerrar Calculadora Científica de Fórmulas (Esc para cerrar)">
            <img id="capyCalculatorToggleImg" src="assets/capy_calc.webp" alt="Calculadora" class="w-11 h-11 object-contain sprite-no-bg">
          </button>
        </div>

      </div>

    </div>
  </nav>

  <!-- HOJA DE FÓRMULAS LATERAL IZQUIERDA (EMPUJA TODO EL CONTENIDO HACIA LA DERECHA PARA NO TAPARLO) -->
  <aside id="formulaDrawerLeft" class="formula-drawer-left" aria-label="Hoja de Fórmulas Espacial">
    <div class="p-4 border-b border-slate-800/80 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <img src="assets/capy_labcoat.webp" alt="Capibara Científico" class="w-12 h-12 object-contain sprite-no-bg">
        <div class="text-left">
          <h2 class="text-xl font-bold text-amber-300 font-patrick leading-tight">Hoja de Fórmulas</h2>
          <p class="text-xs text-cyan-200 font-patrick">Unidades 6, 7 y 8 • Sistema Internacional (Esc cierra)</p>
        </div>
      </div>
      <button type="button" onclick="toggleFormulaDrawer()" class="px-3.5 py-1 rounded-full bg-slate-800 hover:bg-amber-500 text-slate-200 hover:text-slate-950 text-sm font-bold font-patrick transition">
        ✕ Cerrar
      </button>
    </div>

    <!-- Filtro rápido por unidad dentro de la hoja de fórmulas -->
    <div class="px-4 py-2.5 flex items-center justify-center gap-2 border-b border-slate-800/60">
      <button id="fTab_u6" type="button" onclick="renderFormulaSheet('u6')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-amber-400 text-slate-950 font-patrick">Unidad 6</button>
      <button id="fTab_u7" type="button" onclick="renderFormulaSheet('u7')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-slate-800 text-slate-200 font-patrick">Unidad 7</button>
      <button id="fTab_u8" type="button" onclick="renderFormulaSheet('u8')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-slate-800 text-slate-200 font-patrick">Unidad 8</button>
    </div>

    <div id="formulaDrawerContent" class="flex-1 cosmic-scroll p-4 space-y-4"></div>
  </aside>

  <!-- VENTANA LATERAL DERECHA: 'CALCULADORA' DE DATO FALTANTE -->
  <aside id="calculatorDrawerRight" class="calculator-drawer-right" aria-label="Calculadora Científica de Fórmulas">
    <div class="p-4 border-b border-slate-800/80 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <img id="calcHeaderCapyImg" src="assets/capy_calc_open.webp" alt="Capibara Calculadora" class="w-12 h-12 object-contain sprite-no-bg">
        <div class="text-left">
          <h2 class="text-xl font-bold text-amber-300 font-patrick leading-tight">Calculadora de Fórmulas</h2>
          <p class="text-xs text-cyan-200 font-patrick">Deja vacío el dato faltante y presiona Calcular (Esc cierra)</p>
        </div>
      </div>
      <button type="button" onclick="toggleCalculatorDrawer()" class="px-3.5 py-1 rounded-full bg-slate-800 hover:bg-amber-500 text-slate-200 hover:text-slate-950 text-sm font-bold font-patrick transition">
        ✕ Cerrar
      </button>
    </div>

    <!-- Filtro rápido por unidad dentro de la calculadora -->
    <div class="px-4 py-2.5 flex items-center justify-center gap-2 border-b border-slate-800/60">
      <button id="cTab_u6" type="button" onclick="renderCalculatorSheet('u6')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-amber-400 text-slate-950 font-patrick">⚡ Unidad 6</button>
      <button id="cTab_u7" type="button" onclick="renderCalculatorSheet('u7')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-slate-800 text-slate-200 font-patrick">🧪 Unidad 7</button>
      <button id="cTab_u8" type="button" onclick="renderCalculatorSheet('u8')" class="px-3.5 py-1 rounded-full text-sm font-bold bg-slate-800 text-slate-200 font-patrick">🫀 Unidad 8</button>
    </div>

    <div id="calculatorDrawerContent" class="flex-1 cosmic-scroll p-4 space-y-4"></div>
  </aside>

  <!-- CONTENEDOR PRINCIPAL DE ANCHO COMPLETO HASTA LOS LATERALES -->
  <div id="mainWorkspaceWrapper" class="app-push-container w-full max-w-none mx-auto px-2 md:px-4 py-4 flex-1">

    <!-- DISEÑO POR DEFECTO: IZQUIERDA SOLO EL CONTENEDOR DE VIDEO (STICKY) | DERECHA: 1. INFO VIDEO, 2. PDF, 3. DESARROLLO, 4. EJERCICIOS, 5. RESOLUCIÓN -->
    <div id="splitScreenGrid" class="grid grid-cols-1 lg:grid-cols-12 gap-4 xl:gap-5 items-start w-full">

      <!-- COLUMNA IZQUIERDA STICKY: SOLO EL CONTENEDOR DE VIDEO + BARRAS DE VIDEOS + INFO DINÁMICA ENTRE VIDEO Y ARCHIVOS (IMÁGENES 2, 3, 4) -->
      <aside id="leftVideoStickyCol" class="lg:col-span-5 xl:col-span-5 lg:sticky lg:top-[84px] w-full">
        <div id="videoPlayerCardCol" class="nebula-blur-box p-3.5 md:p-5 flex flex-col justify-between lg:max-h-[calc(100vh-96px)] lg:overflow-y-auto cosmic-scroll">
          <div class="w-full flex flex-col justify-center">
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-2xl bg-black/90">
              <iframe
                id="unitVideoIframe"
                class="w-full h-full"
                src="https://www.youtube-nocookie.com/embed/qlwjNDi5ras?enablejsapi=1&rel=0"
                title="Reproductor de Videos por Unidad"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
              </iframe>
            </div>
          </div>

          <!-- Barritas debajo del video (ordenadas por letra y número: A1..C1 en U6; A1..C2 + Álvaro en U7; A1..E3 en una misma barra + Álvaro en U8) -->
          <div id="videoBarsContainer" class="video-bars-stack" aria-label="Navegación entre videos"></div>

          <!-- INFORMACIÓN DINÁMICA Y CORRELACIONADA ENTRE VIDEO Y ARCHIVO / ARCHIVOS (IMÁGENES 2, 3 Y 4) DEBAJO DE LA SECCIÓN DE VIDEOS -->
          <div id="videoDynamicFileRefsBox" class="mt-3 pt-3 border-t border-slate-700/60 space-y-2.5" aria-label="Referencias dinámicas entre video y archivos PDF"></div>
        </div>
      </aside>

      <!-- COLUMNA DERECHA: 1. INFO DEL VIDEO -> 2. PDF CORRESPONDIENTE -> 3. DESARROLLO -> 4. EJERCICIOS -> 5. RESOLUCIÓN -->
      <main id="leftStudyColumn" class="lg:col-span-7 xl:col-span-7 space-y-6 w-full min-w-0 pb-10">

        <!-- 1. PRIMERO: LA INFO DE QUÉ TRATA EL VIDEO -->
        <section id="topVideoSection" class="w-full">
          <div id="videoInfoCardCol" class="nebula-blur-box p-5 md:p-6 flex flex-col max-h-[540px]">
            <div id="videoBoxTitle" class="pb-3 mb-2"></div>
            <div id="videoBoxConceptsContent" class="flex-1 cosmic-scroll px-2 md:px-3"></div>
          </div>
        </section>

        <!-- 2. SEGUNDO (ABAJO DE LA INFO DEL VIDEO): CONTENEDOR DE PDF DEL TAMAÑO DE 1 PÁGINA DE PDF CON LA BARRA DE NAVEGACIÓN DE LA IMAGEN 1 -->
        <section id="pdfViewerSection" class="nebula-blur-box p-3 md:p-5 flex flex-col space-y-3 w-full" aria-label="Visor de Archivos PDF">
          <!-- Barra de navegación de archivos PDF idéntica a la Imagen 1 -->
          <div id="archivosStickyToolbar" class="archivos-inline-toolbar rounded-2xl px-3 md:px-4 py-2.5 space-y-2">
            <div class="flex items-center gap-2.5">
              <img src="assets/capy_study.webp" alt="Archivos" class="w-9 h-9 object-contain sprite-no-bg">
              <h3 id="archivosViewerTitle" class="text-lg md:text-2xl font-bold text-amber-300 font-patrick tracking-wide leading-tight">
                PDF Original — Unidad 6 (Electricidad y Bioelectricidad - 14 páginas)
              </h3>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button type="button" id="pillFile_u6" onclick="openOriginalFileViewer('u6', 1)" class="archivos-pill-btn active">PDF U6</button>
              <button type="button" id="pillFile_u7" onclick="openOriginalFileViewer('u7', 1)" class="archivos-pill-btn">PDF U7</button>
              <button type="button" id="pillFile_u8" onclick="openOriginalFileViewer('u8', 1)" class="archivos-pill-btn">PDF U8</button>
              <button type="button" id="pillFile_carpeta" onclick="openOriginalFileViewer('carpeta', 1)" class="archivos-pill-btn">Carpeta</button>
              <button type="button" id="pillFile_simulacro" onclick="openOriginalFileViewer('simulacro', 1)" class="archivos-pill-btn">Simulacro</button>
              <button type="button" id="pillFile_estructura" onclick="openOriginalFileViewer('estructura', 1)" class="archivos-pill-btn">Estructura</button>

              <select id="archivosPageJumpSelect" onchange="scrollToOriginalPage(this.value)" class="archivos-select-pill" aria-label="Seleccionar página"></select>

              <!-- Controles de Zoom Nítido -->
              <div class="flex items-center gap-1 bg-slate-900/90 border border-slate-700/80 rounded-full px-2.5 py-0.5">
                <button type="button" onclick="adjustFileZoom(-0.2)" class="px-2 text-base font-bold text-cyan-300 hover:text-white font-patrick" title="Alejar Zoom">−</button>
                <span id="archivosZoomReadout" class="text-sm font-bold text-amber-200 font-patrick min-w-[44px] text-center">100%</span>
                <button type="button" onclick="adjustFileZoom(0.2)" class="px-2 text-base font-bold text-cyan-300 hover:text-white font-patrick" title="Acercar Zoom HD">+</button>
                <button type="button" onclick="resetFileZoom()" class="px-2 text-xs text-slate-300 hover:text-amber-300 font-patrick" title="Ajustar al tamaño de 1 página">Ajustar</button>
              </div>

              <button type="button" id="btnToggleSplitMode" onclick="toggleFileFullOrSplit()" class="archivos-pill-btn !bg-cyan-900/60 !border-cyan-500/40 !text-cyan-200 hover:!bg-cyan-400 hover:!text-slate-950" title="Alternar Pantalla Completa">
                ⛶ Pantalla Completa
              </button>
            </div>
          </div>

          <!-- Espacio fijo predefinido del tamaño de 1 página de PDF -->
          <div id="archivosViewerPanel" class="archivos-single-page-pane w-full">
            <div id="archivosPagesScrollContainer" class="w-full h-full cosmic-scroll p-2 md:p-4 space-y-6"></div>
          </div>
        </section>

        <!-- 3. TERCERO: EL DESARROLLO DE LA INFORMACIÓN -->
        <section id="middleConceptSection" class="nebula-blur-box p-5 md:p-7 w-full">
          <div id="dynamicConceptPillsBar" class="concept-pill-bar"></div>
          <div id="unitDevelopmentContainer" class="max-h-[780px] cosmic-scroll px-2 md:px-6 py-3"></div>
        </section>

        <!-- 4. CUARTO: LOS EJERCICIOS -->
        <section id="bottomExercisesSection" class="space-y-6 w-full">
          <div id="exercisesCardBox" class="nebula-blur-box p-5 md:p-7 flex flex-col max-h-[860px] w-full">
            <div id="bottomLeftExercisesBox" class="flex-1 cosmic-scroll px-2 md:px-3"></div>
          </div>

          <!-- 5. QUINTO: LA RESOLUCIÓN DE LOS EJERCICIOS -->
          <div id="resolutionsCardBox" class="nebula-blur-box p-5 md:p-7 flex flex-col max-h-[860px] w-full">
            <div id="bottomRightResolutionsBox" class="flex-1 cosmic-scroll px-2 md:px-3"></div>
          </div>
        </section>

      </main>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
